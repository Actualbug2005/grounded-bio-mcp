[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "grounded-bio-mcp"
version = "0.2.0"
description = "Primary-source bioinformatics MCP server — grounds sequence / structure / variant / compound / literature answers in real database fetches rather than training-data pattern matching."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Devlin" }]
dependencies = [
    # MCP framework — spec §6 originally pinned `mcp[cli]>=1.2.0` (FastMCP 1.0,
    # frozen). Per the mcp-server-dev plugin guidance, migrated to the
    # standalone `fastmcp` (3.x) package for its first-class streamable-HTTP
    # transport and active development. See README → Deviations from spec.
    "fastmcp>=3.0,<4.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "httpx>=0.27",
    "biopython>=1.84",
    "viennarna>=2.6.4",
    "tenacity>=9.0",
    "python-dotenv>=1.0",
    "python-codon-tables>=0.1.12",
    "lxml>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-httpx>=0.32",
    "respx>=0.21",
    "ruff>=0.7",
]

[project.scripts]
grounded-bio-mcp = "grounded_bio_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/grounded_bio_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
markers = [
    "integration: hits real upstream APIs; opt-in via RUN_INTEGRATION=1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]
